<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cinzas de Valdren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:rgba(10,7,22,.9);--ink-soft:rgba(10,7,22,.62);--edge:rgba(186,196,226,.26);--edge-warm:rgba(255,186,110,.5);
  --parch:#ebe2cb;--dim:#9d95b2;--ember:#ffb15a;--star:#aecbff;--hp:#c22b46;--mp:#3a66dd;--st:#34a06e;--gold:#e9c46f;--bad:#ff7070;--good:#8fe3a9;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:rgba(10,7,22,.9);--parch:#ebe2cb;--dim:#9d95b2}}
:root[data-theme="dark"]{--ink:rgba(10,7,22,.9);--parch:#ebe2cb;--dim:#9d95b2}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:#05030c;color:var(--parch);font:16px/1.4 'Alegreya Sans','Trebuchet MS',sans-serif;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;outline:none}
.hidden{display:none!important}
.fell{font-family:'IM Fell English',Georgia,'Times New Roman',serif}
.sc{font-family:'IM Fell English SC',Georgia,'Times New Roman',serif}
button{font:inherit;color:inherit}
button:focus-visible,[data-a]:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
#compass{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(560px,72vw);height:30px;overflow:hidden;
  background:linear-gradient(90deg,transparent,var(--ink-soft) 18%,var(--ink-soft) 82%,transparent);border-bottom:1px solid var(--edge)}
#compass span{position:absolute;top:4px;transform:translateX(-50%);font-size:14px;color:var(--dim);white-space:nowrap}
#compass span.card{font-family:'IM Fell English SC',Georgia,serif;font-size:17px;color:var(--parch);top:2px}
#compass span.q{color:var(--gold);font-size:15px;text-shadow:0 0 6px rgba(233,196,111,.8)}
#compass span.loc{font-size:12px;top:7px}
#compass::after{content:"";position:absolute;left:50%;bottom:0;width:1px;height:8px;background:var(--ember)}
#bossbar{position:absolute;top:calc(58px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(560px,74vw);text-align:center}
#bossbar .bname{font-family:'IM Fell English SC',Georgia,serif;font-size:20px;letter-spacing:.04em;text-shadow:0 2px 6px #000}
#bossbar .bb{height:9px;margin-top:4px;background:rgba(0,0,0,.6);border:1px solid var(--edge)}
#bossbar .bb i{display:block;height:100%;width:100%;background:linear-gradient(#e0405e,#8e1830);transition:width .15s}
#notes{position:absolute;left:18px;top:calc(64px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:5px;max-width:min(420px,60vw)}
#notes div{background:var(--ink-soft);border-left:2px solid var(--edge);padding:5px 10px;font-size:15px;animation:nIn .25s ease-out;text-shadow:0 1px 2px #000}
#notes div.quest{border-color:var(--gold);color:#f5e6be}
#notes div.item{border-color:var(--star)}
#notes div.lvl{border-color:var(--ember);color:var(--ember);font-weight:700}
#notes div.bad{border-color:var(--bad);color:#ffc9c9}
#notes div.skill{border-color:var(--good)}
#notes div.out{opacity:0;transition:opacity .6s}
@keyframes nIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
#crosshair{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;background:rgba(255,240,220,.7);border-radius:50%;box-shadow:0 0 3px #000}
#prompt{position:absolute;left:50%;top:62%;transform:translateX(-50%);background:var(--ink);border:1px solid var(--edge);padding:6px 14px;font-size:16px;white-space:nowrap}
#prompt b{color:var(--ember);font-weight:700;margin-right:6px}
#bark{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);max-width:min(640px,86vw);text-align:center;font-family:'IM Fell English',Georgia,serif;font-size:19px;text-shadow:0 2px 4px #000,0 0 12px #000}
#bark b{color:var(--ember);font-weight:400}
#bars{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;padding:0 4vw;align-items:flex-end}
.bar{width:min(250px,26vw);height:9px;background:rgba(0,0,0,.55);border:1px solid var(--edge);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;transition:width .12s}
.bar.hp{margin:0 auto}.bar.hp i{background:linear-gradient(#e24866,var(--hp));left:50%;transform:translateX(-50%)}
.bar.mp i{background:linear-gradient(#6b92ff,var(--mp))}
.bar.st i{background:linear-gradient(#5fd39a,var(--st));left:auto;right:0}
.bar em{position:absolute;top:-19px;font-style:normal;font-size:12px;color:var(--dim)}
.bar.mp em{left:0}.bar.st em{right:0}.bar.hp em{left:50%;transform:translateX(-50%)}
#hotbar{position:absolute;left:50%;bottom:calc(50px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:4px}
.hs{width:42px;height:42px;background:var(--ink-soft);border:1px solid var(--edge);position:relative;display:flex;align-items:center;justify-content:center}
.hs img{width:30px;height:30px;image-rendering:pixelated}
.hs .k{position:absolute;left:3px;top:0;font-size:11px;color:var(--dim)}
.hs .n{position:absolute;right:3px;bottom:0;font-size:11px}
.hs.act{border-color:var(--ember);box-shadow:0 0 8px rgba(255,177,90,.45)}
.hs .cd{position:absolute;inset:0;background:rgba(0,0,0,.55)}
#lvl{position:absolute;left:18px;bottom:calc(58px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--dim);width:150px}
#lvl .xb{height:3px;background:rgba(255,255,255,.12);margin-top:3px}#lvl .xb i{display:block;height:100%;background:var(--ember)}
#buffs{position:absolute;right:18px;bottom:calc(58px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:13px}
#buffs div{background:var(--ink-soft);padding:2px 8px;border-right:2px solid var(--star)}
#sneak{position:absolute;left:50%;top:calc(50% + 22px);transform:translateX(-50%);font-size:13px;color:var(--dim);letter-spacing:.06em}
#sneak.seen{color:var(--bad)}
#floaters{position:absolute;inset:0;overflow:hidden}
.ebar{position:absolute;width:64px;transform:translate(-50%,-100%)}
.ebar .en{font-size:11px;text-align:center;white-space:nowrap;text-shadow:0 1px 2px #000;margin-bottom:2px}
.ebar .eb{height:4px;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.2)}
.ebar .eb i{display:block;height:100%;background:#d23a52}
.fnum{position:absolute;font-weight:700;font-size:18px;text-shadow:0 1px 3px #000;transform:translate(-50%,-50%);animation:fUp .9s ease-out forwards;white-space:nowrap}
.fnum.crit{color:var(--ember);font-size:22px}.fnum.me{color:#ff8a8a}.fnum.heal{color:var(--good)}.fnum.xp{color:var(--gold);font-size:15px}
@keyframes fUp{to{transform:translate(-50%,-160%);opacity:0}}
#hurt{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(160,0,20,.55));opacity:0;transition:opacity .25s}
#clickplay{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink);border:1px solid var(--edge);padding:14px 26px;font-size:18px;pointer-events:none}

/* ---------- Cinema ---------- */
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s}
#cine{position:fixed;inset:0;pointer-events:none}
#cine .lb{position:absolute;left:0;right:0;height:0;background:#000;transition:height .8s ease}
#cine .lb.top{top:0}#cine .lb.bot{bottom:0}
#cine.on .lb{height:11vh}
#subs{position:absolute;left:50%;bottom:calc(11vh + 22px);transform:translateX(-50%);width:min(820px,88vw);text-align:center;text-shadow:0 2px 5px #000,0 0 14px #000}
#subs b{display:block;font-family:'IM Fell English SC',Georgia,serif;font-weight:400;color:var(--ember);font-size:17px;letter-spacing:.05em;margin-bottom:2px}
#subs span{font-family:'IM Fell English',Georgia,serif;font-size:clamp(18px,2.3vw,24px);line-height:1.45}
#skip{position:absolute;right:22px;bottom:calc(11vh - 30px);font-size:13px;color:var(--dim)}
#card{position:absolute;left:0;right:0;top:36%;text-align:center;opacity:0;transition:opacity 1.6s}
#card.show{opacity:1}
#card h1{margin:0;font-family:'IM Fell English SC',Georgia,serif;font-weight:400;font-size:clamp(38px,7vw,88px);letter-spacing:.03em;color:#f3ead4;text-shadow:0 0 30px rgba(140,90,255,.6),0 4px 12px #000}
#card p{margin:.4em 0 0;font-family:'IM Fell English',Georgia,serif;font-style:italic;font-size:clamp(16px,2vw,22px);color:var(--star)}

/* ---------- Diálogo ---------- */
#dialog{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(860px,94vw);background:linear-gradient(var(--ink),rgba(10,7,22,.96));border:1px solid var(--edge);border-top:1px solid var(--edge-warm);padding:18px 24px 14px}
#dialog .dn{font-family:'IM Fell English SC',Georgia,serif;font-size:21px;color:var(--ember)}
#dialog .dn small{font-family:'Alegreya Sans',sans-serif;font-size:13px;color:var(--dim);margin-left:10px}
#dialog .dt{font-family:'IM Fell English',Georgia,serif;font-size:19px;line-height:1.55;margin:8px 0 12px;max-width:72ch}
#dialog .dopt{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 8px;cursor:pointer;font-size:17px;color:var(--parch)}
#dialog .dopt:hover,#dialog .dopt:focus-visible{background:rgba(255,177,90,.1);color:#fff}
#dialog .dopt i{font-style:normal;color:var(--ember);margin-right:10px;display:inline-block;width:14px}

/* ---------- Painéis ---------- */
.win{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink);border:1px solid var(--edge);box-shadow:0 20px 60px rgba(0,0,0,.7)}
#panel{width:min(1080px,95vw);height:min(680px,90vh);display:flex;flex-direction:column}
#panel .tabs{display:flex;border-bottom:1px solid var(--edge);padding:0 10px}
#panel .tabs button{background:none;border:0;padding:12px 16px 10px;cursor:pointer;font-family:'IM Fell English SC',Georgia,serif;font-size:19px;color:var(--dim);border-bottom:2px solid transparent}
#panel .tabs button.on{color:var(--parch);border-color:var(--ember)}
#panel .tabs .gold{margin-left:auto;align-self:center;color:var(--gold);font-size:15px}
#panel .pb{flex:1;overflow:hidden;display:flex;min-height:0}
#panel .pf{border-top:1px solid var(--edge);padding:7px 14px;font-size:13px;color:var(--dim)}
.col{overflow-y:auto;padding:12px 14px;min-height:0}
.col::-webkit-scrollbar{width:8px}.col::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15)}
.lst{flex:1.25;border-right:1px solid var(--edge)}
.det{flex:1}
.filters{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.filters button,.btn{background:rgba(255,255,255,.04);border:1px solid var(--edge);padding:5px 11px;cursor:pointer;font-size:14px}
.filters button.on{border-color:var(--ember);color:var(--ember)}
.btn:hover,.filters button:hover{background:rgba(255,177,90,.12)}
.btn.pri{border-color:var(--edge-warm);color:#ffd9a8}
.btn[disabled]{opacity:.35;cursor:default}
.row{display:flex;align-items:center;gap:10px;padding:5px 8px;cursor:pointer;border:1px solid transparent}
.row:hover{background:rgba(255,255,255,.05)}
.row.sel{border-color:var(--edge-warm);background:rgba(255,177,90,.07)}
.row img{width:28px;height:28px;image-rendering:pixelated;flex:none}
.row .nm{flex:1;min-width:0}
.row .nm small{color:var(--dim);margin-left:6px}
.row .eq{color:var(--ember);font-size:12px}
.row .vl{color:var(--gold);font-size:14px;min-width:44px;text-align:right}
.row.dis{opacity:.45}
.det h3{margin:0 0 4px;font-family:'IM Fell English SC',Georgia,serif;font-weight:400;font-size:24px}
.det .ds{font-family:'IM Fell English',Georgia,serif;font-style:italic;color:#cfc4a8;margin:6px 0 12px;max-width:52ch}
.stat{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(255,255,255,.08);padding:3px 0;font-size:15px;max-width:360px}
.stat b{font-weight:500;color:#fff}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.hint{font-size:13px;color:var(--dim);margin-top:10px}
.skl{padding:8px 10px;border:1px solid transparent;margin-bottom:4px}
.skl .top{display:flex;justify-content:space-between;align-items:baseline}
.skl .top b{font-family:'IM Fell English SC',Georgia,serif;font-weight:400;font-size:19px}
.skl .pbar{height:3px;background:rgba(255,255,255,.1);margin:4px 0 6px}.skl .pbar i{display:block;height:100%;background:var(--good)}
.perk{display:inline-flex;gap:6px;align-items:center;font-size:13px;border:1px solid var(--edge);padding:3px 8px;margin:2px 4px 2px 0;background:rgba(0,0,0,.25);cursor:pointer}
.perk.got{border-color:var(--ember);color:var(--ember)}
.perk.lock{opacity:.45;cursor:default}
.lvup{border:1px solid var(--edge-warm);padding:10px 12px;margin-bottom:12px;background:rgba(255,177,90,.06)}
.qrow{padding:8px 10px;cursor:pointer;border-left:2px solid transparent}
.qrow:hover{background:rgba(255,255,255,.04)}
.qrow.tr{border-color:var(--gold)}
.qrow .qn{font-family:'IM Fell English SC',Georgia,serif;font-size:19px}
.qrow .qo{font-size:14px;color:var(--dim)}
.qrow.done .qn{color:var(--dim);text-decoration:line-through rgba(255,255,255,.3)}
.sect{font-family:'IM Fell English',Georgia,serif;font-style:italic;color:var(--star);margin:10px 0 4px;font-size:16px}
#mapc{width:100%;height:100%;image-rendering:pixelated;background:#050310}

/* modais */
#modal{width:min(820px,94vw);max-height:88vh;display:flex;flex-direction:column}
#modal .mh{padding:12px 18px;border-bottom:1px solid var(--edge);display:flex;align-items:baseline;gap:12px}
#modal .mh h2{margin:0;font-family:'IM Fell English SC',Georgia,serif;font-weight:400;font-size:24px}
#modal .mh .gold{margin-left:auto;color:var(--gold)}
#modal .mb{display:flex;min-height:0;flex:1;overflow:hidden}
#modal .mf{border-top:1px solid var(--edge);padding:10px 18px;display:flex;gap:8px;justify-content:flex-end;align-items:center}
#modal .mf .hint{margin:0 auto 0 0}
#modal.small{width:min(440px,92vw)}
.menu-list{display:flex;flex-direction:column;padding:14px 18px;gap:4px}
.menu-list button{background:none;border:0;text-align:left;padding:8px 6px;cursor:pointer;font-family:'IM Fell English',Georgia,serif;font-size:21px;color:var(--parch)}
.menu-list button:hover,.menu-list button:focus-visible{color:var(--ember)}
.menu-list button[disabled]{opacity:.35;cursor:default}
.opt{display:flex;justify-content:space-between;align-items:center;padding:8px 0;gap:16px;border-bottom:1px dashed rgba(255,255,255,.08)}
.opt input[type=range]{width:160px;accent-color:var(--ember)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:15px}
.keys kbd{font:inherit;color:var(--ember);white-space:nowrap}

/* título */
#title{position:fixed;inset:0;display:flex;align-items:flex-end;padding:0 0 12vh 7vw;background:radial-gradient(ellipse at 70% 60%,transparent 30%,rgba(3,1,10,.75) 100%),linear-gradient(90deg,rgba(3,1,10,.82),transparent 55%)}
#title .blk{max-width:560px}
#title h1{margin:0;font-family:'IM Fell English SC',Georgia,serif;font-weight:400;font-size:clamp(46px,8vw,104px);line-height:.92;color:#f3ead4;text-shadow:0 0 34px rgba(130,80,255,.55),0 4px 14px #000}
#title .tag{font-family:'IM Fell English',Georgia,serif;font-style:italic;color:var(--star);font-size:clamp(17px,2vw,22px);margin:.5em 0 1.6em}
#title .menu-list{padding:0}
#title .menu-list button{font-size:26px;padding:6px 0}
#title .foot{margin-top:26px;font-size:13px;color:var(--dim)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05030c;font-family:'IM Fell English',Georgia,serif;font-style:italic;font-size:22px;color:var(--star)}
@media (max-width:700px){#bars{padding:0 3vw}.bar{width:28vw}#hotbar .hs{width:34px;height:34px}.hs img{width:24px;height:24px}#lvl{display:none}}
@media (prefers-reduced-motion:reduce){#notes div{animation:none}.fnum{animation-duration:.01s}}
</style>
</head>
<body>
<canvas id="cv" tabindex="0"></canvas>
<div id="hud" class="hidden">
  <div id="hurt"></div>
  <div id="floaters"></div>
  <div id="compass"></div>
  <div id="bossbar" class="hidden"><div class="bname"></div><div class="bb"><i></i></div></div>
  <div id="notes"></div>
  <div id="crosshair"></div>
  <div id="sneak" class="hidden">furtivo</div>
  <div id="prompt" class="hidden"></div>
  <div id="bark" class="hidden"></div>
  <div id="lvl"></div>
  <div id="buffs"></div>
  <div id="hotbar"></div>
  <div id="bars">
    <div class="bar mp"><em>Mana</em><i></i></div>
    <div class="bar hp"><em>Vida</em><i></i></div>
    <div class="bar st"><em>Vigor</em><i></i></div>
  </div>
</div>
<div id="cine" class="hidden"><div class="lb top"></div><div class="lb bot"></div><div id="card"></div><div id="subs"></div><div id="skip">Espaço para pular</div></div>
<div id="dialog" class="hidden"></div>
<div id="panel" class="win hidden"></div>
<div id="modal" class="win hidden"></div>
<div id="clickplay" class="hidden">Clique para continuar</div>
<div id="title" class="hidden"></div>
<div id="fade"></div>
<div id="loading">Forjando o mundo…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

// ---- 01_core.js ----
'use strict';
// ================= UTILIDADES =================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const $ = id => document.getElementById(id);
const wrapAng = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const lerpAng = (a, b, t) => a + wrapAng(b - a) * t;
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let WR = mulberry32(90210);
const wr = (a, b) => a + (b - a) * WR();
const rnd = (a, b) => a + (b - a) * Math.random();
const rndi = (a, b) => Math.floor(a + (b - a + 1) * Math.random());
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
function hash2(x, y) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, o) { o = o || 4; let s = 0, amp = .5, f = 1, n = 0; for (let i = 0; i < o; i++) { s += amp * vnoise(x * f, y * f); n += amp; amp *= .5; f *= 2.03; } return s / n; }
const dist2 = (ax, az, bx, bz) => Math.hypot(ax - bx, az - bz);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const V3 = (x, y, z) => new THREE.Vector3(x || 0, y || 0, z || 0);
function segDist(px, pz, ax, az, bx, bz) {
  const vx = bx - ax, vz = bz - az, wx = px - ax, wz = pz - az, L = vx * vx + vz * vz;
  const t = L ? clamp((wx * vx + wz * vz) / L, 0, 1) : 0;

    if (this.chordT > (combat ? 3.2 : 8)) { this.chordT = 0; this.chordI++; this.setChord(this.chordI); }
    const target = combat ? 1500 : this.mood === 'dungeon' ? 480 : this.mood === 'dawn' ? 1700 : 650;
    this.filt.frequency.setTargetAtTime(target + Math.sin(performance.now() / 3000) * 120, this.ctx.currentTime, .5);
    if (combat) { this.beatT -= dt; if (this.beatT <= 0) { this.beatT = .6; this.tone(58, .35, 'sine', .32, 38); if (Math.random() < .4) this.noise(.08, .08, 3000, 1, 'highpass', .3); } }
  }
};

const Cam = {

  update(dt) {
    const p = G.p; const sens = .0022 * G.settings.sens;
    this.yaw -= Input.mdx * sens; this.pitch -= Input.mdy * sens * (G.settings.invY ? -1 : 1);
    if (Input.k.ArrowLeft) this.yaw += 2.2 * dt; if (Input.k.ArrowRight) this.yaw -= 2.2 * dt;
    if (Input.k.ArrowUp) this.pitch += 1.4 * dt; if (Input.k.ArrowDown) this.pitch -= 1.4 * dt;
    this.pitch = clamp(this.pitch, -1.15, .85);
    this.tdist = clamp(this.tdist + Input.wheel * .8, 1.8, 11); this.dist = lerp(this.dist, this.tdist, Math.min(1, 8 * dt));

    const cp = Math.cos(this.pitch), f = V3(Math.sin(this.yaw) * cp, Math.sin(this.pitch), Math.cos(this.yaw) * cp), rt = V3(-Math.cos(this.yaw), 0, Math.sin(this.yaw));

      if (Col.blocked(q.x, q.y, q.z) || (G.zone !== 'world' && (q.y > 6.6 || q.y < .3))) { d = Math.max(.6, d * (i - 1) / steps - .1); break; }
    }
    const pos = base.clone().addScaledVector(f, -d); const gy = groundAt(pos.x, pos.z) + .35; if (pos.y < gy) pos.y = gy;
    if (this.shake > 0) { this.shake = Math.max(0, this.shake - dt * 2.5); const a = this.shake * .35; pos.x += rnd(-a, a); pos.y += rnd(-a, a); pos.z += rnd(-a, a); }
    camera.position.copy(pos); camera.lookAt(base.clone().addScaledVector(f, 12));
  },
  fwd() { return V3(Math.sin(this.yaw), 0, Math.cos(this.yaw)); }
};
